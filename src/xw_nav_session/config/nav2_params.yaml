# Gen2 Nav2 — Smac2D + RotationShim/RPP + filtered dual-depth local costmap.
# Rock 5T: no MPPI as primary. Collision Monitor sits after velocity_smoother.
# Footprint: 0.45 x 0.35 body box. Frames: base_link.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.50
    alpha4: 0.55
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.35
    laser_likelihood_max_dist: 0.5
    max_beams: 50
    z_hit: 0.85
    z_short: 0.05
    z_max: 0.01
    z_rand: 0.08
    sigma_hit: 0.12
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.3
    beam_skip_error_threshold: 0.5
    beam_skip_threshold: 0.5
    min_particles: 300
    max_particles: 2000
    kld_err: 0.01
    kld_z: 0.99
    resample_interval: 2
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_slow: 0.005
    recovery_alpha_fast: 0.02
    update_min_a: 0.08
    update_min_d: 0.08
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    tf_broadcast: true
    # Target after stamp fixes; was 1.0 on gen1 port
    transform_tolerance: 0.3
    save_pose_rate: 2.0
    set_initial_pose: False
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    initial_cov_xx: 0.15
    initial_cov_yy: 0.15
    initial_cov_aa: 0.15
    scan_topic: "scan"

bt_navigator:
  ros__parameters:
    use_sim_time: False
    transform_tolerance: 0.3
    goal_reached_tol: 0.32
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 5000
    wait_for_service_timeout: 5000
    # Overridden by RewrittenYaml in nav2.launch.py
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    failure_tolerance: 2.5
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50
      stateful: True

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.40
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.50
      max_angular_accel: 1.0
      closed_loop: false
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- RPP (same level as shim; Humble string primary_controller) ---
      desired_linear_vel: 0.28
      lookahead_dist: 0.45
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.65
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.50
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      max_allowed_time_to_collision_up_to_carrot: 1.8
      # Keep depth in local costmap for cost-regulated avoidance; hard trajectory
      # collision veto is too brittle with near-field depth noise (zeros all cmd_vel).
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.55
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.2
      inflation_cost_scaling_factor: 2.5
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 1.5
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # 0.45 x 0.35 body (URDF collision box)
      footprint: "[[0.225, 0.175], [0.225, -0.175], [-0.225, -0.175], [-0.225, 0.175]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Laser + depth pointclouds for local avoidance (do not drop depth).
        observation_sources: scan depth1 depth2
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
        depth1:
          topic: /camera/front_up/depth/points_nav
          max_obstacle_height: 1.4
          min_obstacle_height: 0.08
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth2:
          topic: /camera/front_down/depth/points_nav
          max_obstacle_height: 1.4
          min_obstacle_height: 0.08
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          observation_persistence: 0.0
          expected_update_rate: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 0.3
      footprint: "[[0.225, 0.175], [0.225, -0.175], [-0.225, -0.175], [-0.225, 0.175]]"
      resolution: 0.05
      unknown_cost_value: 255
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: False
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        track_unknown_space: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.45

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "MOORE"
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_distance: 1.45
      max_rotational_vel: 0.45
      rotational_acc_lim: 1.5
    backup:
      plugin: "nav2_behaviors/BackUp"
      back_up_speed: 0.18
      back_up_distance: 1.2
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.45
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.6]
    min_velocity: [-0.20, 0.0, -0.6]
    max_accel: [0.8, 0.0, 1.2]
    max_decel: [-1.2, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Collision Monitor: after smoother, before arbiter (/xw/cmd/nav)
# NOTE: live CM loads config/collision_monitor.yaml (flat points). Keep in sync.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "/xw/cmd/nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 0.5
    polygons: ["FrontStop", "SideLeft", "SideRight"]
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 1.5
      enabled: True
      source_timeout: 1.0
    FrontStop:
      type: "polygon"
      points: [0.58, 0.18, 0.58, -0.18, 0.12, -0.18, 0.12, 0.18]
      action_type: "stop"
      max_points: 2
      visualize: False
      polygon_pub_topic: "front_cm_polygon"
      enabled: True
    SideLeft:
      type: "polygon"
      points: [0.20, 0.28, 0.20, 0.18, -0.10, 0.18, -0.10, 0.28]
      action_type: "stop"
      max_points: 2
      visualize: False
      enabled: True
    SideRight:
      type: "polygon"
      points: [0.20, -0.18, 0.20, -0.28, -0.10, -0.28, -0.10, -0.18]
      action_type: "stop"
      max_points: 2
      visualize: False
      enabled: True
