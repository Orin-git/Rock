local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0  # 10Hz 对 ARM 板过重；5Hz 与 10Hz 激光仍够用
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link #base_scan #base_link #
      use_sim_time: False
      # 与 AMCL/global_costmap 对齐。CPU 抖动时 scan 时间戳可落后 tf cache 1s+，
      # 过小会导致 obstacle_layer 丢帧、网页障碍显示异常。
      transform_tolerance: 1.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.23
        # plugins: ["voxel_layer", "inflation_layer"]
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.2
        inflation_radius: 0.23  # 不得低于 robot_radius(0.23)，否则 Nav2 容器会崩溃
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan depth1 depth2
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
        depth1:
          topic: /camera/front_up/depth/points
          max_obstacle_height: 1.6
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth2:
          topic: /camera/front_down/depth/points
          max_obstacle_height: 1.6
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
          observation_persistence: 0.0
          expected_update_rate: 0.0
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        # topics: ["/ultrasonic_1", "/ultrasonic_3"]
        topics: ["/ultrasonic_1", "/ultrasonic_2", "/ultrasonic_3", "/ultrasonic_4"]
        input_sensor_type: "VARIABLE"  # 超声波通常是可变距离传感器
        phi: 1.2                      # 观测角度参数
        inflate_cone: 0.8             # 锥形区域膨胀系数 (0-1)
        clear_threshold: 0.2          # 清除障碍物的概率阈值
        mark_threshold: 0.8           # 标记障碍物的概率阈值
        clear_on_max_reading: True    # 当读到最大距离时是否清除区域
        transform_tolerance: 0.3      # TF变换容差，原先为1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_link #base_scan #base_link ##!!
      use_sim_time: False
      # global_costmap 经 map→odom 还要再过一层 TF，时间戳更易落到 cache 之外。
      # 用 1.0 与 AMCL 对齐，配合 AMCL 的 transform_tolerance: 1.0 避免 scan 整批丢失。
      transform_tolerance: 1.5
      robot_radius: 0.23
      resolution: 0.05
      unknown_cost_value: 255 # 将未知区域设置为高代价
      track_unknown_space: true ## 启用未知区域跟踪
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          # 同 local：只用最新帧 + inf 视为有效清扫，减少全局图上的鬼影绕路
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        track_unknown_space: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.2
        inflation_radius: 0.28


map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.20
      use_astar: false
      allow_unknown: false
      cost_neutral_lambda: 0.2  # 添加中性代价权重

