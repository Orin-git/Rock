# Gen2 front depth camera #1 (Angstrong HP60C / ASJ ZNX_NVT, USB 3482:6723)
#
# Public contract: /camera/front/{color,depth}/...
# Vendor private:  /ascamera_hp60c/camera_publisher/...
# Robot frame:     camera_front_link
#
# USB pin (Rock 5T): bus 5 path 1.2  →  KERNEL 5-1.2
# If cams swap after replug, re-check: udevadm info -a -n ... ATTR{busnum}/ATTR{devpath}

camera_id: front
vendor_namespace: ascamera_hp60c
bridge_node_name: xw_depth_topic_bridge
static_tf_node_name: camera_front_optical_static
robot_frame: camera_front_link
vendor_frame: ascamera_hp60c_camera_link_0

usb_bus_no: 5
usb_path: "1.2"
color_pcl: false
pub_tfTree: true

depth_width: 640
depth_height: 480
rgb_width: 640
rgb_height: 480
fps: 10

preview_fps: 5.0
relay_raw_rgb: false
enable_pointcloud: false
points_fps: 10.0
manage_pointcloud_control: true
gate_rgb_on_sessions: true

rgb_image_in: /ascamera_hp60c/camera_publisher/rgb0/image
rgb_info_in: /ascamera_hp60c/camera_publisher/rgb0/camera_info
depth_image_in: /ascamera_hp60c/camera_publisher/depth0/image_raw
depth_info_in: /ascamera_hp60c/camera_publisher/depth0/camera_info
mjpeg_in: /ascamera_hp60c/camera_publisher/mjpeg0/compressed
points_in: /ascamera_hp60c/camera_publisher/depth0/points

rgb_image_out: /camera/front/color/image_raw
rgb_info_out: /camera/front/color/camera_info
depth_image_out: /camera/front/depth/image_raw
depth_info_out: /camera/front/depth/camera_info
compressed_out: /camera/front/color/image_raw/compressed
points_out: /camera/front/depth/points
