# Gen2 front depth camera #1 (Angstrong HP60C / ASJ ZNX_NVT, USB 3482:6723)
#
# Public contract: /camera/front_up/{color,depth}/...
# Vendor private:  /ascamera_hp60c/camera_publisher/...
# Robot frame:     camera_front_up_link
#
# USB pin: bus 4 root path 1 — KERNEL 4-1.
# 2026-08-31: physical UPSIDE camera now enumerates on bus 4; configs swapped so logical front_up = physical top.
# Do NOT share Bus1 with chassis hub+lidar; dual HP60C must stay on different hosts.

camera_id: front_up
vendor_namespace: ascamera_hp60c
bridge_node_name: xw_depth_topic_bridge
static_tf_node_name: camera_front_up_optical_static
robot_frame: camera_front_up_link
vendor_frame: ascamera_hp60c_camera_link_0

usb_bus_no: 3
usb_path: "1"
color_pcl: false
pub_tfTree: true

# Single cam on USB2: 640@5fps OK. Dual cam needs SuperSpeed then restore dual + raise fps.
depth_width: 640
depth_height: 480
rgb_width: 640
rgb_height: 480
# HP60C stream modes: use 10 (5 is rejected: "Not support width, height or fps").
fps: 10

preview_fps: 5.0
relay_raw_rgb: false
enable_pointcloud: false
points_fps: 10.0
manage_pointcloud_control: true
gate_rgb_on_sessions: true

rgb_image_in: /ascamera_hp60c/camera_publisher/rgb0/image
rgb_info_in: /ascamera_hp60c/camera_publisher/rgb0/camera_info
depth_image_in: /ascamera_hp60c/camera_publisher/depth0/image_raw
depth_info_in: /ascamera_hp60c/camera_publisher/depth0/camera_info
mjpeg_in: /ascamera_hp60c/camera_publisher/mjpeg0/compressed
points_in: /ascamera_hp60c/camera_publisher/depth0/points

rgb_image_out: /camera/front_up/color/image_raw
rgb_info_out: /camera/front_up/color/camera_info
depth_image_out: /camera/front_up/depth/image_raw
depth_info_out: /camera/front_up/depth/camera_info
compressed_out: /camera/front_up/color/image_raw/compressed
points_out: /camera/front_up/depth/points
