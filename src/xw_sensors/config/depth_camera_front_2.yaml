# Gen2 front depth camera #2 (Angstrong HP60C / ASJ ZNX_NVT, USB 3482:6723)
#
# Public contract: /camera/front_2/{color,depth}/...
# Vendor private:  /ascamera_hp60c_2/camera_publisher/...
# Robot frame:     camera_front_2_link
#
# USB pin (Rock 5T): bus 1 path 1.1  →  KERNEL 1-1.1
# Perception / safety gate stay on /camera/front; this cam is bring-up + future nav/face.

camera_id: front_2
vendor_namespace: ascamera_hp60c_2
bridge_node_name: xw_depth_topic_bridge_front_2
static_tf_node_name: camera_front_2_optical_static
robot_frame: camera_front_2_link
vendor_frame: ascamera_hp60c_2_camera_link_0

usb_bus_no: 1
usb_path: "1.1"
color_pcl: false
pub_tfTree: true

depth_width: 640
depth_height: 480
rgb_width: 640
rgb_height: 480
fps: 10

preview_fps: 5.0
relay_raw_rgb: false
enable_pointcloud: false
points_fps: 10.0
# Do not steal front cam's /xw/camera/set_pointcloud* services.
manage_pointcloud_control: false
gate_rgb_on_sessions: false

rgb_image_in: /ascamera_hp60c_2/camera_publisher/rgb0/image
rgb_info_in: /ascamera_hp60c_2/camera_publisher/rgb0/camera_info
depth_image_in: /ascamera_hp60c_2/camera_publisher/depth0/image_raw
depth_info_in: /ascamera_hp60c_2/camera_publisher/depth0/camera_info
mjpeg_in: /ascamera_hp60c_2/camera_publisher/mjpeg0/compressed
points_in: /ascamera_hp60c_2/camera_publisher/depth0/points

rgb_image_out: /camera/front_2/color/image_raw
rgb_info_out: /camera/front_2/color/camera_info
depth_image_out: /camera/front_2/depth/image_raw
depth_info_out: /camera/front_2/depth/camera_info
compressed_out: /camera/front_2/color/image_raw/compressed
points_out: /camera/front_2/depth/points
