<section class="panel nav-toolbar" aria-label="导航控制与状态">
      <div class="nav-toolbar-row">
        <div class="nav-toolbar-group nav-toolbar-session">
          <label class="nav-toolbar-label" for="mapSelect">地图</label>
          <select id="mapSelect" class="nav-toolbar-select"></select>
          <div class="nav-toolbar-btns">
            <button type="button" class="secondary" id="refreshMaps" title="刷新地图列表">刷新</button>
            <button type="button" class="secondary" id="loadMapPreview" title="加载地图预览">预览</button>
            <button type="button" id="startNav">进导航</button>
            <button type="button" class="secondary" id="stopNav">结束</button>
            <button type="button" class="danger" id="estop">急停</button>
          </div>
        </div>
        <div class="nav-toolbar-sep" aria-hidden="true"></div>
        <div class="nav-toolbar-group nav-toolbar-tools">
          <button type="button" class="secondary tool-btn" id="toolInitialPose" title="拖设初位姿">初位姿</button>
          <button type="button" id="applyInitialPose" title="确认初位姿">确认</button>
          <button type="button" class="secondary tool-btn" id="toolEditWp" title="编辑航点">编辑</button>
          <button type="button" class="secondary" id="startPatrol" title="多点巡航">巡航</button>
          <label class="nav-loop-cell nav-toolbar-loop" for="patrolLoop" title="巡航循环">
            <input type="checkbox" id="patrolLoop" />
            <span>循环</span>
          </label>
          <button type="button" class="secondary" id="cancelNav" title="取消当前导航">取消</button>
        </div>
        <div class="nav-toolbar-sep" aria-hidden="true"></div>
        <div class="nav-status-bar nav-toolbar-status" aria-label="会话状态">
          <div class="nav-status-chip nav-loc-chip" id="navLocChip" data-loc="1" title="定位健康">
            <span class="nav-loc-badge" id="navLocBadge" aria-label="定位 1">1</span>
            <span class="nav-status-tag">定位</span>
            <span class="nav-status-text" id="navLocText">未就绪</span>
          </div>
          <div class="nav-status-chip nav-goal-chip" id="navGoalChip" data-phase="idle" title="点位导航">
            <span class="nav-status-dot" aria-hidden="true"></span>
            <span class="nav-status-tag">导航</span>
            <span class="nav-status-text" id="navGoalText">待命</span>
            <span class="nav-status-sub" id="navGoalSub"></span>
          </div>
          <div class="nav-status-chip nav-recharge-chip nav-recharge-strip" id="navRechargeStrip" data-phase="idle" title="自动回充">
            <span class="nav-recharge-dot nav-status-dot" aria-hidden="true"></span>
            <span class="nav-recharge-tag nav-status-tag">回充</span>
            <span class="nav-recharge-phase nav-status-text" id="navRechargePhase">待命</span>
            <span class="nav-recharge-msg nav-status-sub" id="navRechargeMsg"></span>
          </div>
        </div>
      </div>
      <p class="nav-toolbar-hint muted" id="sessionHint" hidden>选地图 → 进导航。定位正常则直接前往，失败才需确认初位姿</p>
      <div class="nav-vdb-strip" id="visualDbStrip" aria-label="视觉定位库"
           data-overlay-covered="green"
           data-overlay-yaw-insufficient="yellow"
           data-overlay-unvisited="gray"
           data-overlay-nav-failed="red"
           data-overlay-unreachable="dark-gray">
        <div class="nav-vdb-row" id="vdbSummaryRow">
          <div class="nav-vdb-meta" id="visualDbMeta">
            <span class="nav-vdb-id"><b id="vdbMapName">—</b>/<b id="vdbActive">—</b></span>
            <span><b id="vdbFrames">—</b>帧</span>
            <span><b id="vdbCells">—</b>格</span>
          </div>
          <span class="nav-vdb-chip" id="vdbBuildPhaseChip" data-phase="incomplete"><b id="vdbBuildPhase">—</b></span>
          <div class="nav-vdb-inline" id="vdbMetrics">
            <span class="nav-vdb-inline-item" title="空间覆盖">
              空间 <b id="vdbSpatialPct">—</b>
              <span class="nav-vdb-bar nav-vdb-bar-sm" aria-hidden="true"><i id="vdbSpatialBar" style="width:0%"></i></span>
              <span class="muted" id="vdbSpatialDetail">—/—</span>
            </span>
            <span class="nav-vdb-inline-item" title="朝向充分">
              朝向 <b id="vdbYawPct">—</b>
              <span class="nav-vdb-bar nav-vdb-bar-sm" aria-hidden="true"><i id="vdbYawBar" style="width:0%"></i></span>
              <span class="muted" id="vdbYawDetail">—/—</span>
            </span>
            <span class="nav-vdb-gate-sm" id="vdbGate" title="完成标准">
              <span class="nav-vdb-gate-item" id="vdbGateSpatial">空间</span>
              <span class="nav-vdb-gate-item" id="vdbGateYaw">Yaw</span>
              <span class="nav-vdb-gate-item" id="vdbGateNav">Nav</span>
            </span>
          </div>
          <div class="nav-vdb-actions">
            <button type="button" id="startVisualDbBuild" title="从零建立视觉定位库">自动建立</button>
            <button type="button" id="resumeVisualDbBuild" hidden title="仅补剩余缺口">继续补全</button>
            <button type="button" class="secondary" id="reoptVisualDbBuild" hidden title="在已完成库上重新优化">重新优化</button>
            <button type="button" class="secondary" id="stopVisualDbBuild" hidden title="停止建库">停止</button>
            <button type="button" class="secondary nav-vdb-toggle" id="vdbToggleDetails" aria-expanded="false" title="展开建库详情">详情</button>
          </div>
        </div>
        <div class="nav-vdb-details" id="vdbDetails" hidden>
          <div class="nav-vdb-sys" id="vdbSysRow">
            <span>系统 <b id="vdbSysState">—</b></span>
            <span>最近任务 <b id="vdbTaskState">—</b></span>
          </div>
          <div class="nav-vdb-gaps" id="vdbGaps">
            <span>未访问 <b id="vdbGapUnvisited">—</b></span>
            <span>朝向不足 <b id="vdbGapYaw">—</b></span>
            <span>导航失败待重试 <b id="vdbGapNav">—</b></span>
            <span>不可达 <b id="vdbGapUnreach">—</b></span>
          </div>
          <div class="nav-vdb-gate" id="vdbGateFull">
            <span class="nav-vdb-gate-title">完成标准</span>
            <span class="nav-vdb-gate-item" id="vdbGateSpatialFull">空间 ≥80%</span>
            <span class="nav-vdb-gate-item" id="vdbGateYawFull">Yaw ≥70%</span>
            <span class="nav-vdb-gate-item" id="vdbGateNavFull">Nav失败 ≤10%</span>
          </div>
          <p class="nav-vdb-status muted" id="visualDbStatus" hidden></p>
        </div>
        <script type="application/json" id="vdbOverlayPalette">{"COVERED":"green","YAW_INSUFFICIENT":"yellow","UNVISITED":"gray","NAV_FAILED":"red","UNREACHABLE":"dark-gray"}</script>
      </div>
      <div class="nav-flash" id="navFlash" hidden></div>
    </section>

    <div class="nav-map-wp-grid">
      <div class="nav-map-col">
        <section class="panel map-stage nav-map-stage">
          <div id="map-container" class="nav-interactive">

            <canvas id="overlay-canvas"></canvas>
            <div id="orientation-controls-panel" class="orientation-controls-panel" style="display:none"></div>
          </div>
          <div class="map-stage-foot nav-map-foot">
            <p class="map-meta" id="mapStatus">画布未启动</p>

            <p class="map-meta" id="poseHint">位姿：—</p>
            <p class="map-meta" id="toolHint">工具：浏览</p>
          </div>
        </section>
      </div>

      <div class="nav-wp-col">
        <section class="panel nav-wp-panel">
          <div class="nav-wp-head">
            <h2>
              航点
              <span class="section-count" id="wpCount">0</span>
              <span class="section-sub" id="wpMapTag"></span>
            </h2>
            <div class="nav-wp-bar">
              <button type="button" class="secondary" id="reloadWp">刷新</button>
              <button type="button" id="saveWp">保存</button>
              <button type="button" class="secondary" id="deleteWp" disabled>删</button>
              <button type="button" class="secondary" id="gotoSelectedWp" disabled>前往</button>
            </div>
          </div>
          <p class="muted hint-sm nav-wp-hint" id="wpHint">
            <code id="wpListFileHint">{地图}_pointList</code> ·
            <a href="/pages/maps.html">地图管理</a>
          </p>
          <div class="list-panel nav-wp-list" id="wpList">
            <p class="muted pad">选择地图后加载</p>
          </div>
          <div class="nav-task-actions" aria-label="导航任务">
            <button type="button" class="secondary nav-task-btn" id="navFollowBtn" title="须先进入导航；开跟随只取消点位，不拆 Nav2">
              人体跟随
            </button>
            <button type="button" class="secondary nav-task-btn" id="navRechargeBtn" title="激光认桩后倒车对接；须先进入导航">
              自动回充
            </button>
          </div>
          <p class="muted hint-sm nav-task-hint" id="navTaskHint"></p>
        </section>
      </div>
    </div>
