<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>建图 · 小维二代</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="mapping-body">
  <header class="top">
    <div class="brand">小维<span>GEN-2 / ROCK 5T</span></div>
    <nav>
      <a href="/">总览</a>
      <a href="/pages/topics.html">话题</a>
      <a href="/pages/viz.html">可视化</a>
      <a href="/pages/teleop.html">遥控</a>
      <a class="active" href="/pages/mapping.html">建图</a>
      <a href="/pages/navigation.html">导航</a>
      <a href="/pages/maps.html">地图</a>
      <a href="/pages/map_beautify.html">美化</a>
      <a href="/pages/settings.html">设置</a>
    </nav>
    <div class="top-status">
      <div id="conn" class="pill off">链路…</div>
    </div>
  </header>

  <main class="mapping-page">
    <section class="mapping-page-head">
      <div class="tag">SLAM</div>
      <h1>建图</h1>
      <p class="mapping-lead muted">mode=1 启停 · 画布叠 /map+/scan · 随时保存</p>
      <p class="map-meta mapping-mode" id="modeHint">模式：—</p>
    </section>

    <div class="mapping-grid">
      <section class="panel map-stage mapping-stage">
        <div id="map-container">
          <canvas id="map-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
        </div>
        <div class="map-stage-foot">
          <p class="map-meta" id="mapStatus">画布未启动</p>
        </div>
      </section>

      <aside class="mapping-side">
        <section class="panel mapping-card mapping-save">
          <h2>保存地图</h2>
          <div class="map-name-row">
            <input id="mapName" type="text" autocomplete="off" spellcheck="false" placeholder="地图名" />
            <button type="button" id="save">保存</button>
          </div>
          <p class="muted hint-sm map-save-hint">默认 <code>YYYYMMDD_HHMMSS</code> · 同名覆盖</p>
        </section>

        <div class="mapping-actions">
          <section class="panel mapping-card map-action-card">
            <h2>手推建图</h2>
            <p class="muted hint-sm map-action-desc">遥控推动扫描环境</p>
            <div class="btn-stack">
              <button type="button" id="startManual">开始手推建图</button>
              <button type="button" class="secondary" id="stop">结束建图</button>
            </div>
          </section>

          <section class="panel mapping-card map-action-card">
            <h2>自主建图</h2>
            <p class="muted hint-sm map-action-desc">Frontier 自主规划路径建图</p>
            <div class="btn-stack">
              <button type="button" id="startAuto">开始自主建图</button>
              <button type="button" class="secondary" id="stopAuto" hidden>停止自主建图</button>
              <p class="muted hint-sm text-center mt-0" id="autoHint">待命</p>
            </div>
          </section>

          <section class="panel mapping-card map-action-card map-action-teleop">
            <h2>手推遥控</h2>
            <p class="muted hint-sm map-action-desc">建图过程中手动驱动</p>
            <div class="map-action-body map-action-teleop">
              <div class="joystick-wrap" id="stick"><div class="knob" id="knob"></div></div>
              <p class="muted mono text-center mt-0" id="vel">vx=0.00 wz=0.00</p>
              <div class="btn-stack">
                <button type="button" class="secondary" id="teleopStop">急停归零</button>
              </div>
            </div>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <script src="/js/vendor/foxglove_bundle.js"></script>
  <script src="/js/vendor/roslib_foxglove.js"></script>
  <script src="/js/vendor/ros_ws_helper.js"></script>
  <script src="/js/map_canvas.js"></script>
  <script type="module">
    import {
      connect,
      setMode,
      mapManage,
      publishTeleop,
      onTask,
      onState,
      setExploreEnabled,
    } from '/js/api.js';
    import '/js/app.js';

    connect();

    const mapNameEl = document.getElementById('mapName');
    const mapStatus = document.getElementById('mapStatus');
    const modeHint = document.getElementById('modeHint');
    const autoHint = document.getElementById('autoHint');
    const startAutoBtn = document.getElementById('startAuto');
    const stopAutoBtn = document.getElementById('stopAuto');
    let mappingActive = false;
    let exploreActive = false;
    let savedOnce = false;

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function defaultMapName() {
      const d = new Date();
      return (
        d.getFullYear() +
        pad2(d.getMonth() + 1) +
        pad2(d.getDate()) +
        '_' +
        pad2(d.getHours()) +
        pad2(d.getMinutes()) +
        pad2(d.getSeconds())
      );
    }

    function flashStatus(line) {
      mapStatus.textContent = String(line || '').replace(/^(>>|!!|<<)\s*/, '');
    }

    function setExploreUi(on, message) {
      exploreActive = !!on;
      startAutoBtn.hidden = exploreActive;
      stopAutoBtn.hidden = !exploreActive;
      autoHint.textContent = message || (exploreActive ? '探索中…' : '待命');
    }

    mapNameEl.value = defaultMapName();

    onTask((l) => flashStatus(l));
    onState((s) => {
      const name = s.mode_name || String(s.mode);
      modeHint.textContent = `模式：${name} (${s.mode}) · ${s.detail || ''}`;
      mappingActive = Number(s.mode) === 1;
      const ex = s.explore || {};
      if (typeof ex.enabled === 'boolean' || ex.phase) {
        const on = !!ex.enabled || !!ex.active;
        const phase = ex.phase || '';
        const msg = ex.message || '';
        let line = msg;
        if (on && phase === 'exploring') line = msg || '自主探索中';
        else if (phase === 'starting') line = msg || '启动探索栈…';
        else if (phase === 'success') line = msg || '探索完成';
        else if (phase === 'fail') line = msg || '探索失败';
        else if (!on) line = msg || '待命';
        setExploreUi(on && phase !== 'success' && phase !== 'fail' && phase !== 'idle', line);
        if (phase === 'success') savedOnce = true;
      }
    });

    if (window.XwMapCanvas) {
      window.XwMapCanvas.start({
        onStatus: (msg) => {
          mapStatus.textContent = msg;
        },
      });
    } else {
      mapStatus.textContent = 'map_canvas.js 未加载';
    }

    document.getElementById('startManual').onclick = async () => {
      savedOnce = false;
      if (!mapNameEl.value.trim()) mapNameEl.value = defaultMapName();
      flashStatus('手推建图 setMode(1)');
      await setMode(1, {});
    };

    startAutoBtn.onclick = async () => {
      savedOnce = false;
      let name = mapNameEl.value.trim();
      if (!name) {
        name = defaultMapName();
        mapNameEl.value = name;
      }
      flashStatus(`自主建图启动 ${name}…`);
      setExploreUi(true, '启动中…');
      const j = await setExploreEnabled(true, name);
      if (!j || !j.ok) {
        setExploreUi(false, (j && j.message) || '启动失败');
        flashStatus(`自主建图失败 ${(j && j.message) || ''}`);
      }
    };

    stopAutoBtn.onclick = async () => {
      const name = mapNameEl.value.trim() || ('' + Date.now());
      if (!confirm(`停止自主建图并保存地图「${name}」？`)) return;
      flashStatus('停止自主建图…');
      // Save first while SLAM /map still live, then drop explore + leave mapping
      const save = await mapManage(1, name);
      if (save && save.ok) {
        savedOnce = true;
        flashStatus(`已保存 ${name}`);
      } else {
        flashStatus(`保存失败 ${(save && save.message) || ''}（仍将停止探索）`);
      }
      await setExploreEnabled(false);
      await setMode(0, {});
      setExploreUi(false, '待命');
    };

    document.getElementById('stop').onclick = async () => {
      if (exploreActive) {
        const ok = confirm('正在自主建图。结束将停止探索并交由后端处理保存。是否结束？');
        if (!ok) return;
        await setExploreEnabled(false);
      } else if (mappingActive && !savedOnce) {
        const ok = confirm(
          '当前建图会话尚未手动保存。\n结束将交由后端 autosave（若已有栅格）。\n是否结束？'
        );
        if (!ok) return;
      }
      flashStatus('结束建图 setMode(0)');
      await setMode(0, {});
      setExploreUi(false, '待命');
    };

    document.getElementById('save').onclick = async () => {
      let name = mapNameEl.value.trim();
      if (!name) {
        name = defaultMapName();
        mapNameEl.value = name;
      }
      const list = await mapManage(2);
      const maps = list.map_list || [];
      if (maps.indexOf(name) !== -1) {
        if (!confirm(`地图「${name}」已存在，继续保存将覆盖。是否继续？`)) return;
      }
      flashStatus(`保存地图 ${name}…`);
      const j = await mapManage(1, name);
      if (j && j.ok) {
        savedOnce = true;
        flashStatus(`保存成功 ${j.message || name}`);
      } else {
        flashStatus(`保存失败 ${j && j.message ? j.message : ''}`);
      }
    };

    mapNameEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('save').click();
    });

    const stick = document.getElementById('stick');
    const knob = document.getElementById('knob');
    const vel = document.getElementById('vel');
    let active = false;

    function setKnob(nx, ny) {
      const r = 48;
      knob.style.transform = `translate(calc(-50% + ${nx * r}px), calc(-50% + ${ny * r}px))`;
      const vx = -ny * 0.35;
      const wz = -nx * 0.8;
      vel.textContent = `vx=${vx.toFixed(2)} wz=${wz.toFixed(2)}`;
      publishTeleop(vx, wz);
    }

    function fromEvent(e) {
      const rect = stick.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      let dx = (t.clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
      let dy = (t.clientY - (rect.top + rect.height / 2)) / (rect.height / 2);
      const mag = Math.hypot(dx, dy) || 1;
      if (mag > 1) {
        dx /= mag;
        dy /= mag;
      }
      setKnob(dx, dy);
    }

    stick.addEventListener('pointerdown', (e) => {
      active = true;
      stick.setPointerCapture(e.pointerId);
      fromEvent(e);
    });
    stick.addEventListener('pointermove', (e) => {
      if (active) fromEvent(e);
    });
    const end = () => {
      active = false;
      setKnob(0, 0);
      publishTeleop(0, 0);
    };
    stick.addEventListener('pointerup', end);
    stick.addEventListener('pointercancel', end);
    document.getElementById('teleopStop').onclick = end;
  </script>
</body>
</html>
