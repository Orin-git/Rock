<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>遥控 · 小维二代</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">小维<span>GEN-2 / ROCK 5T</span></div>
    <nav>
      <a href="/">总览</a>
      <a href="/pages/topics.html">话题</a>
      <a href="/pages/viz.html">可视化</a>
      <a class="active" href="/pages/teleop.html">遥控</a>
      <a href="/pages/mapping.html">建图</a>
      <a href="/pages/navigation.html">导航</a>
      <a href="/pages/maps.html">地图</a>
      <a href="/pages/map_beautify.html">美化</a>
      <a href="/pages/settings.html">设置</a>
    </nav>
    <div class="top-status">
      <div id="conn" class="pill off">链路…</div>
    </div>
  </header>
  <main>
    <section class="page-head">
      <div class="tag">Manual Drive</div>
      <h1>遥控与点动</h1>
      <p class="muted">速度经 /xw/cmd/teleop → 仲裁 → 安全门 → /cmd_vel</p>
    </section>
    <div class="cols-2">
      <section class="panel">
        <h2>遥控摇杆</h2>
        <div class="joystick-wrap" id="stick"><div class="knob" id="knob"></div></div>
        <p class="muted" id="vel" style="font-family:var(--font-mono)">vx=0.00 wz=0.00</p>
        <div class="btn-row"><button class="secondary" id="stop">急停归零</button></div>
      </section>
      <section class="panel">
        <h2>定距点动</h2>
        <p class="muted" style="margin-top:0">角度：+左转 / −右转；距离：+前进 / −后退</p>
        <label>角度 (°)</label>
        <input id="ang" type="number" value="0" step="5" />
        <label>距离 (m)</label>
        <input id="dist" type="number" value="0.3" step="0.1" />
        <div class="btn-row" style="flex-wrap:wrap;gap:0.5rem">
          <button type="button" class="secondary" data-jog="90,0">左转 90°</button>
          <button type="button" class="secondary" data-jog="-90,0">右转 90°</button>
          <button type="button" class="secondary" data-jog="180,0">掉头 180°</button>
          <button type="button" class="secondary" data-jog="0,1">前进 1m</button>
          <button type="button" class="secondary" data-jog="0,-1">后退 1m</button>
          <button type="button" class="secondary" data-jog="0,0.3">前进 0.3m</button>
          <button type="button" class="secondary" data-jog="0,-0.3">后退 0.3m</button>
        </div>
        <div class="btn-row">
          <button id="jog">执行</button>
          <button type="button" class="secondary" id="jogStop">停止点动</button>
        </div>
        <p class="muted" id="jogStatus" style="font-family:var(--font-mono);font-size:0.75rem">/api/motion → /xw/motion/command</p>
      </section>
    </div>
  </main>
  <script type="module">
    import { connect, publishTeleop, callMotion } from '/js/api.js';
    import '/js/app.js';
    connect();
    const stick = document.getElementById('stick');
    const knob = document.getElementById('knob');
    const vel = document.getElementById('vel');
    const jogBtn = document.getElementById('jog');
    const status = document.getElementById('jogStatus');
    let active = false;
    let jogging = false;

    function setKnob(nx, ny) {
      const r = 78;
      knob.style.transform = `translate(calc(-50% + ${nx * r}px), calc(-50% + ${ny * r}px))`;
      const vx = -ny * 0.35, wz = -nx * 0.8;
      vel.textContent = `vx=${vx.toFixed(2)} wz=${wz.toFixed(2)}`;
      publishTeleop(vx, wz);
    }
    function fromEvent(e) {
      const rect = stick.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      let dx = (t.clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
      let dy = (t.clientY - (rect.top + rect.height / 2)) / (rect.height / 2);
      const mag = Math.hypot(dx, dy) || 1;
      if (mag > 1) { dx /= mag; dy /= mag; }
      setKnob(dx, dy);
    }
    stick.addEventListener('pointerdown', (e) => { active = true; stick.setPointerCapture(e.pointerId); fromEvent(e); });
    stick.addEventListener('pointermove', (e) => { if (active) fromEvent(e); });
    const end = () => { active = false; setKnob(0, 0); publishTeleop(0, 0); };
    stick.addEventListener('pointerup', end);
    stick.addEventListener('pointercancel', end);
    document.getElementById('stop').onclick = end;

    async function runJog(ang, dist, label) {
      if (jogging) return;
      jogging = true;
      jogBtn.disabled = true;
      document.getElementById('ang').value = ang;
      document.getElementById('dist').value = dist;
      const dir = Number(dist) > 0 ? '前进' : Number(dist) < 0 ? '后退' : '转向';
      status.textContent = `${label || dir} 下发中… ang=${ang} dist=${dist}`;
      const j = await callMotion(ang, dist);
      if (j.ok) {
        status.textContent = `ok: ${j.message || 'accepted'}`;
      } else {
        status.textContent = `fail: ${j.message || 'error'}`;
      }
      jogBtn.disabled = false;
      jogging = false;
    }

    jogBtn.onclick = () => runJog(
      document.getElementById('ang').value,
      document.getElementById('dist').value,
      '自定义',
    );
    document.querySelectorAll('[data-jog]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const [a, d] = btn.getAttribute('data-jog').split(',').map(Number);
        runJog(a, d, btn.textContent.trim());
      });
    });
    document.getElementById('jogStop').onclick = async () => {
      publishTeleop(0, 0);
      const j = await callMotion(0, 0);
      status.textContent = j.ok ? '已停止点动' : `stop: ${j.message || ''}`;
    };
  </script>
</body>
</html>
