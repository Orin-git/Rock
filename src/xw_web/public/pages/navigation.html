<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导航 · 小维二代</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">小维<span>GEN-2 / ROCK 5T</span></div>
    <nav>
      <a href="/">总览</a>
      <a href="/pages/topics.html">话题</a>
      <a href="/pages/viz.html">可视化</a>
      <a href="/pages/teleop.html">遥控</a>
      <a href="/pages/mapping.html">建图</a>
      <a class="active" href="/pages/navigation.html">导航</a>
      <a href="/pages/maps.html">地图</a>
      <a href="/pages/map_beautify.html">美化</a>
      <a href="/pages/settings.html">设置</a>
    </nav>
    <div class="top-status">
      <div id="conn" class="pill off">链路…</div>
    </div>
  </header>
  <main class="nav-page">
    <section class="page-head nav-page-head">
      <h1>导航</h1>
      <span class="tag">Nav Session</span>
      <p class="muted nav-page-lead" id="sessionHint">选地图 → 进入导航 → 拖设初位姿并确认</p>
    </section>

    <section class="panel nav-console">
      <div class="nav-console-cols">
        <div class="nav-console-left">
          <div class="nav-console-head">
            <span class="nav-console-block-title">会话</span>
            <span class="nav-console-head-sep">·</span>
            <label class="nav-console-map-label" for="mapSelect">地图</label>
          </div>
          <select id="mapSelect" class="nav-console-select"></select>
          <div class="nav-console-btn-row nav-console-btn-row-5">
            <button type="button" class="secondary" id="refreshMaps">刷新</button>
            <button type="button" class="secondary" id="loadMapPreview">预览</button>
            <button type="button" id="startNav">进入导航</button>
            <button type="button" class="secondary" id="stopNav">结束导航</button>
            <button type="button" class="danger" id="estop">急停</button>
          </div>
        </div>
        <div class="nav-console-right">
          <div class="nav-console-head">
            <span class="nav-console-block-title">位姿与航点</span>
          </div>
          <div class="nav-console-btn-row nav-console-btn-row-3">
            <button type="button" class="secondary tool-btn" id="toolInitialPose">拖设初位姿</button>
            <button type="button" id="applyInitialPose">确认初位姿</button>
            <button type="button" class="secondary tool-btn" id="toolEditWp">编辑航点</button>
          </div>
          <div class="nav-console-btn-row nav-console-btn-row-3">
            <button type="button" class="secondary" id="startPatrol">多点巡航</button>
            <label class="nav-loop-cell" for="patrolLoop">
              <input type="checkbox" id="patrolLoop" />
              <span>循环</span>
            </label>
            <button type="button" class="secondary" id="cancelNav">取消导航</button>
          </div>
        </div>
      </div>
      <div class="nav-flash" id="navFlash" hidden></div>
    </section>

    <div class="section-title">地图与激光</div>
    <section class="panel map-stage nav-map-stage">
      <div id="map-container" class="nav-interactive">
        <canvas id="map-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
        <div id="orientation-controls-panel" class="orientation-controls-panel" style="display:none"></div>
      </div>
      <div class="map-stage-foot nav-map-foot">
        <p class="map-meta" id="mapStatus">画布未启动</p>
        <p class="map-meta" id="modeHint">模式：—</p>
        <p class="map-meta" id="poseHint">位姿：—</p>
        <p class="map-meta" id="toolHint">工具：浏览（点列表航点可前往）</p>
      </div>
    </section>

    <div class="section-title">航点列表 <span class="section-count" id="wpCount">0</span></div>
    <section class="panel nav-wp-panel">
      <div class="btn-row nav-wp-bar">
        <button type="button" class="secondary" id="reloadWp">刷新</button>
        <button type="button" id="saveWp">保存航点</button>
        <button type="button" class="secondary" id="deleteWp" disabled>删除选中</button>
        <button type="button" class="secondary" id="gotoSelectedWp" disabled>前往选中</button>
      </div>
      <p class="muted hint-sm" id="wpHint">点「编辑航点」在地图打点/拖动，改完务必「保存航点」。导航中：点列表或地图上的航点即可前往。红点 = 距障碍 &lt;0.3m，不可保存/前往。</p>
      <div class="list-panel nav-wp-list" id="wpList">
        <p class="muted pad">选择地图后加载</p>
      </div>
    </section>
  </main>

  <script src="/js/vendor/foxglove_bundle.js"></script>
  <script src="/js/vendor/roslib_foxglove.js"></script>
  <script src="/js/vendor/ros_ws_helper.js"></script>
  <script src="/js/map_canvas.js"></script>
  <script type="module" src="/js/navigation_page.js"></script>
</body>
</html>
