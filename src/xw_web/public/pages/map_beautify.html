<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>美化 · 小维二代</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">小维<span>GEN-2 / ROCK 5T</span></div>
    <nav>
      <a href="/">总览</a>
      <a href="/pages/topics.html">话题</a>
      <a href="/pages/viz.html">可视化</a>
      <a href="/pages/teleop.html">遥控</a>
      <a href="/pages/mapping.html">建图</a>
      <a href="/pages/navigation.html">导航</a>
      <a href="/pages/maps.html">地图</a>
      <a class="active" href="/pages/map_beautify.html">美化</a>
      <a href="/pages/settings.html">设置</a>
    </nav>
    <div class="top-status">
      <div id="conn" class="pill off">链路…</div>
    </div>
  </header>
  <main>
    <section class="page-head">
      <div class="tag">Map Edit</div>
      <h1>地图美化</h1>
      <p class="muted">
        离线编辑已保存的 PGM · 画墙 / 擦除 · 经
        <code>/api/map</code> 读写，保存自动备份
      </p>
    </section>

    <section class="panel beautify-bar">
      <div class="beautify-load">
        <label for="mapSelect">地图</label>
        <select id="mapSelect">
          <option value="">— 选择地图 —</option>
        </select>
        <button type="button" id="btnLoadMap">加载</button>
        <button type="button" class="secondary" id="btnRefreshList">刷新列表</button>
      </div>
      <p class="muted mono hint-sm" id="editStatus">未加载地图</p>
    </section>

    <section class="panel beautify-tools">
      <div class="beautify-tool-row">
        <button type="button" class="secondary active" data-mode="pan">平移</button>
        <button type="button" class="secondary" data-mode="draw" data-need-map disabled>画墙</button>
        <button type="button" class="secondary" data-mode="erase" data-need-map disabled>擦除</button>
        <span class="beautify-divider"></span>
        <label class="beautify-brush">
          笔刷
          <input id="brushSize" type="range" min="1" max="12" value="1" />
          <span id="brushSizeLabel" class="mono">1</span>
        </label>
        <span class="beautify-divider"></span>
        <button type="button" class="secondary" id="btnFitView" data-need-map disabled>居中</button>
        <button type="button" class="secondary" id="btnUndo" data-need-map disabled>撤销</button>
        <button type="button" class="secondary" id="btnReset" data-need-map disabled>放弃修改</button>
        <span class="beautify-divider"></span>
        <button type="button" id="btnSave" data-need-map disabled>保存</button>
        <button type="button" class="secondary" id="btnSaveAs" data-need-map disabled>另存为</button>
      </div>
      <p class="muted hint-sm beautify-hint">
        墙直接画进主地图 · 笔刷 1 = 单像素 · 空格或 Shift 临时平移 · 滚轮缩放
      </p>
    </section>

    <div class="section-title">画布 <span class="section-count" id="coordInfo">—</span></div>
    <section class="panel map-stage beautify-stage">
      <div id="map-container">
        <canvas id="map-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
    </section>
  </main>

  <div id="toast" class="beautify-toast" aria-live="polite"></div>

  <script type="module" src="/js/map_beautify_page.js"></script>
</body>
</html>
